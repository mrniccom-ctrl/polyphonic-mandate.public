<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Polyphonic Mandate — Public Chat UI</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;max-width:800px;margin:2rem auto;padding:1rem}
    #log{border:1px solid #ddd;padding:1rem;height:60vh;overflow:auto;background:#fafafa}
    .msg{margin:0.5rem 0}
    .me{color:blue}
    .bot{color:green}
    form{display:flex;gap:.5rem;margin-top:.5rem}
    input[type=text]{flex:1;padding:.5rem}
  </style>
</head>
<body>
  <h1>Polyphonic Mandate — Public Chat UI</h1>
  <p>This is a simple static UI that can talk to any HTTP chat endpoint that accepts POST /chat with JSON {"message": "..."} and returns JSON {"reply": "..."}.</p>

  <label>Worker / API endpoint URL: <input id="endpoint" type="text" value="https://your-worker.example.workers.dev" style="width:60%"></label>

  <div id="log" aria-live="polite"></div>

  <form id="form">
    <input id="input" type="text" placeholder="Message to agents..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const endpointEl = document.getElementById('endpoint');

    function append(who, text){
      const d = document.createElement('div'); d.className='msg '+(who==='me'?'me':'bot');
      d.textContent = (who==='me'?'> ':'') + text; log.appendChild(d); log.scrollTop = log.scrollHeight;
    }

    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const message = input.value.trim(); if(!message) return;
      append('me', message);
      input.value='';
      const url = (endpointEl.value || '').replace(/\/$/,'') + '/chat';
      append('bot', '… contacting '+url);
      try{
        const resp = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({message})
        });
        const json = await resp.json();
        append('bot', json.reply ?? JSON.stringify(json));
      }catch(err){
        append('bot', 'Error: '+err.message);
      }
    });
  </script>
</body>
</html>
